<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0c10; color: #c5c6c7; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .wrap { position: relative; }
  canvas { display: block; background: #1f2833; border: 2px solid #45a29e; border-radius: 6px; box-shadow: 0 0 20px rgba(69,162,158,0.25); }
  .hud { position: absolute; top: -42px; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; letter-spacing: 1px; color: #66fcf1; text-shadow: 0 0 6px rgba(102,252,241,0.4); }
  .panel { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: rgba(11,12,16,0.88); border-radius: 6px; z-index: 5; }
  .panel.show { display: flex; }
  h1 { margin: 0 0 8px; font-size: 28px; color: #66fcf1; text-shadow: 0 0 10px rgba(102,252,241,0.5); }
  p { margin: 0; font-size: 15px; color: #a4b0be; }
  .btn { padding: 10px 22px; font-size: 16px; font-weight: 700; color: #0b0c10; background: #66fcf1; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn:active { background: #45a29e; }
  .controls { margin-top: 14px; display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px; gap: 8px; }
  .d { width: 60px; height: 60px; border-radius: 12px; border: 2px solid #45a29e; background: transparent; color: #66fcf1; font-size: 24px; font-weight: 800; cursor: pointer; }
  .d:active { background: #45a29e; color: #fff; }
  .hide { display: none !important; }
  .hint { margin-top: 12px; font-size: 12px; color: #667085; }
</style>
</head>
<body>

<div class="wrap">
  <canvas id="game" width="320" height="320"></canvas>
  <div class="hud">
    <span id="score">Score 0</span>
    <span id="best">Best 0</span>
  </div>
  <div id="startPanel" class="panel show">
    <h1>Snake</h1>
    <p>Arrow keys or swipe to move</p>
    <button class="btn" id="startBtn">Start</button>
  </div>
  <div id="overPanel" class="panel">
    <h1>Game Over</h1>
    <p id="finalScore">Score 0</p>
    <button class="btn" id="restartBtn">Try Again</button>
  </div>
</div>

<div class="controls">
  <button class="d hide" id="btnUp">&#9650;</button>
  <button class="d" id="btnLeft">&#9664;</button>
  <button class="d" id="btnDown">&#9660;</button>
  <button class="d" id="btnRight">&#9665;</button>
</div>

<div class="hint">Use arrow keys, tap a direction, or swipe</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startPanel = document.getElementById('startPanel');
  const overPanel = document.getElementById('overPanel');
  const finalScoreEl = document.getElementById('finalScore');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  const GRID = 20;
  const TILE = canvas.width / GRID;

  let best = localStorage.getItem('snake_best') || 0;
  bestEl.textContent = 'Best ' + best;

  let running = false;
  let snake = [];
  let dir = { x: 0, y: 0 };
  let nextDir = { x: 0, y: 0 };
  let food = { x: 0, y: 0 };
  let score = 0;
  let tick = 0;
  let tickRate = 6;
  let gameOver = false;

  function reset() {
    snake = [
      { x: 10, y: 15 },
      { x: 10, y: 16 },
      { x: 10, y: 17 }
    ];
    dir = { x: 0, y: -1 };
    nextDir = { x: 0, y: -1 };
    score = 0;
    tick = 0;
    tickRate = 6;
    gameOver = false;
    scoreEl.textContent = 'Score 0';
    placeFood();
    running = true;
    overPanel.classList.remove('show');
    startPanel.classList.add('hide');
    requestAnimationFrame(loop);
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
    }
  }

  function draw() {
    ctx.fillStyle = '#1f2833';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff0055';
    ctx.beginPath();
    ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, TILE / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#66fcf1' : '#45a29e';
      ctx.shadowColor = i === 0 ? 'rgba(102,252,241,0.6)' : 'rgba(69,162,158,0.4)';
      ctx.shadowBlur = 8;
      ctx.fillRect(seg.x * TILE + 1, seg.y * TILE + 1, TILE - 2, TILE - 2);
      ctx.shadowBlur = 0;
    });
  }

  function update() {
    if (!running || gameOver) return;

    dir = nextDir;

    tick++;
    if (tick < tickRate) return;
    tick = 0;

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      endGame();
      return;
    }

    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = 'Score ' + score;
      if (tickRate > 3) tickRate--;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function loop() {
    update();
    draw();
    if (running) requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = 'Best ' + best;
    }
    finalScoreEl.textContent = 'Score ' + score;
    overPanel.classList.add('show');
    startPanel.classList.remove('hide');
  }

  function setDir(dx, dy) {
    if (dx === -dir.x && dy === -dir.y) return;
    nextDir = { x: dx, y: dy };
  }

  startBtn.addEventListener('click', () => { startPanel.classList.add('hide'); reset(); });
  restartBtn.addEventListener('click', () => { overPanel.classList.remove('show'); reset(); });

  window.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp':    e.preventDefault(); setDir(0, -1); break;
      case 'ArrowDown':  e.preventDefault(); setDir(0, 1); break;
      case 'ArrowLeft':  e.preventDefault(); setDir(-1, 0); break;
      case 'ArrowRight': e.preventDefault(); setDir(1, 0); break;
    }
  });

  document.getElementById('btnUp').addEventListener('click', () => setDir(0, -1));
  document.getElementById('btnDown').addEventListener('click', () => setDir(0, 1));
  document.getElementById('btnLeft').addEventListener('click', () => setDir(-1, 0));
  document.getElementById('btnRight').addEventListener('click', () => setDir(1, 0));

  let touchStart = null;
  canvas.addEventListener('touchstart', e => { touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else if (Math.abs(dy) > 0) {
      setDir(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });
</script>

</body>
</html>
