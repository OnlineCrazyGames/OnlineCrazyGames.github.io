<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="hud">
    <div class="hud-item"><span class="label">SCORE</span><span id="score" class="value">0</span></div>
    <div class="hud-item"><span class="label">BEST</span><span id="best" class="value">0</span></div>
    <div class="hud-item"><span class="label">LEVEL</span><span id="level" class="value">1</span></div>
  </div>
  <div id="startPanel" class="panel show">
    <div class="logo">SNAKE</div>
    <p>Arrow keys or swipe to move</p>
    <button class="btn" id="startBtn">Start Game</button>
  </div>
  <div id="pausePanel" class="panel">
    <div class="logo">Paused</div>
    <button class="btn" id="resumeBtn">Resume</button>
  </div>
  <div id="overPanel" class="panel">
    <div class="logo">Game Over</div>
    <p id="finalScore">Score 0</p>
    <p id="newBest" class="best-msg">New Best!</p>
    <button class="btn" id="restartBtn">Play Again</button>
  </div>
</div>

<div class="controls">
  <button class="d" id="btnUp">&#9650;</button>
  <div class="d-row">
    <button class="d" id="btnLeft">&#9664;</button>
    <button class="d" id="btnDown">&#9660;</button>
    <button class="d" id="btnRight">&#9665;</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
