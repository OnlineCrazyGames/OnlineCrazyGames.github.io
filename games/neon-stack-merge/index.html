<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Stack Merge</title>
<style>body{margin:0;background:#0a0620;color:#f5f2ff;font-family:system-ui;height:100dvh;display:flex;justify-content:center;align-items:center} .wrap{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column} canvas{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;width:100%;flex:1} .panel{background:rgba(255,255,255,.06);border-radius:18px;padding:12px;margin:8px} button{padding:10px 20px;border-radius:999px;border:none;background:linear-gradient(110deg,#ff4fa3,#7c5cff 55%,#29e3d0);color:white;font-weight:700} h1{background:linear-gradient(110deg,#ff4fa3,#7c5cff 55%,#29e3d0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}</style>
</head><body><div class="wrap"><div class="panel"><h1>Neon Stack Merge</h1><div>Score <b id="score">0</b> Best <b id="best">0</b></div></div><canvas id="c"></canvas><div class="panel"><button id="play">Play</button><button id="mute">Mute</button></div></div><script>
const c=document.getElementById('c'), ctx=c.getContext('2d'), scoreEl=document.getElementById('score'); let score=0, running=false;
function resize(){c.width=c.clientWidth*2; c.height=c.clientHeight*2;} window.addEventListener('resize',resize); resize();
document.getElementById('play').onclick=()=>{running=true; score=0; loop();}; let last=0;
function loop(t=0){if(!running)return; ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='#7c5cff'; ctx.fillRect(c.width/2-20,c.height/2-20,40,40); score+=0.01; scoreEl.textContent=Math.floor(score); requestAnimationFrame(loop);}
</script></body></html>
